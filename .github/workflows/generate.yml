name: CuteVerse Auto Reel Pipeline

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number (e.g. 1)"
        required: true
        default: "1"
        type: string
      language:
        description: "Language: en, hi, or gu"
        required: true
        default: "en"
        type: choice
        options:
          - en
          - hi
          - gu
      duration:
        description: "Duration in seconds (30 to 60)"
        required: true
        default: "30"
        type: string
  schedule:
    - cron: "0 6 * * 1,4"

jobs:
  build-auto-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, Noto fonts, and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            ffmpeg \
            fonts-noto \
            fonts-noto-core || true
          fc-cache -f -v || true
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Reel pipeline with retry
        run: |
          EP="${{ github.event.inputs.episode || '1' }}"
          LANG="${{ github.event.inputs.language || 'en' }}"
          DUR="${{ github.event.inputs.duration || '30' }}"

          if ! [[ "$EP" =~ ^[0-9]+$ ]] || [ "$EP" -lt 1 ]; then
            echo "::error::Invalid episode input: $EP"
            exit 1
          fi
          if ! [[ "$DUR" =~ ^[0-9]+$ ]] || [ "$DUR" -lt 30 ] || [ "$DUR" -gt 60 ]; then
            echo "::error::Duration must be between 30 and 60 seconds, got: $DUR"
            exit 1
          fi

          ATTEMPT=1
          MAX_RETRIES=2
          until python main.py --episode "$EP" --language "$LANG" --duration "$DUR"; do
            if [ "$ATTEMPT" -ge "$MAX_RETRIES" ]; then
              echo "::error::Auto pipeline failed after $MAX_RETRIES attempts"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

      - name: Upload Auto Reel outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuteverse-auto-ep${{ github.event.inputs.episode || '1' }}-${{ github.event.inputs.language || 'en' }}
          path: output/auto_reels/
          if-no-files-found: warn
          
